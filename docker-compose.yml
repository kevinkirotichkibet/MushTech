services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/mushtech
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789abcdef}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # one-shot: docker compose --profile seed run --rm seed
  seed:
    build: ./backend
    profiles: ["seed"]
    command: ["node", "dist/seed.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/mushtech
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_RESET: ${SEED_RESET:-false}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
